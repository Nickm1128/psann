  max_seconds: 2700
  target_parameters: 304565264
  target_dimensions:
    d_model: 1024
    n_layers: 16
    n_heads: 16
    d_mlp: 4096
  purpose: Full-size short pilots at 2048-token context; compare depth/width and sine
    initialization at approximately 304M parameters. Not a complete pretraining run.
