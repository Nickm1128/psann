bench:
  seeds:
  - 1337
  - 2027
  - 3407
models:
  transformer:
    kind: lm
    architecture:
      kind: transformer
      activation:
        kind: gelu
        amplitude_init: 1.0
        frequency_init: 1.0
        decay_init: 0.1
        learnable:
        - amplitude
        - frequency
        - decay
        decay_mode: abs
        bounds: null
        slope_init: 1.0
        slope_trainable: true
        clip_max: 1.0
        activation_types: null
        activation_ratios: null
        phase_init: 0.0
        phase_trainable: true
        ratio_sum_tol: 0.001
        mix_layout: random
        mix_seed: null
        feature_dim: -1
      activation_initialization: null
      residual: null
      spectral: null
      temporal: null
      geometry: null
      geometry_execution: null
    d_model: 256
    n_layers: 4
    n_heads: 4
    d_mlp: 1024
    vocab_size: 50257
    dropout: 0.0
    positional_encoding: rope
    attention_implementation: sdpa
train:
  max_steps: 1024
  warmup_steps: 64
  lr: 0.0012
  batch_tokens: 4096
  grad_accum_steps: 1
  amp: bf16
  weight_decay: 0.01
exploration:
  eval_interval: 128
  eval_tokens: 65536
  max_seconds: 7200
  target_parameters: 304565264
  target_dimensions:
    d_model: 1024
    n_layers: 16
    n_heads: 16
    d_mlp: 4096
  purpose: Independent-corpus confirmation; document-disjoint from the scout corpus,
    shared split across fresh model replicas.
data:
  sequence_length: 512
  validation_fraction: 0.05
  split_seed: 953
  max_documents: 50000
  train_tokens: 33554432
  validation_tokens: 1048576
  files:
  - outputs/exploration_data/fineweb_confirmation.jsonl
tokenizer:
  backend: tokenizers
  model_path: runs/tokenizer_300m_fineweb_edu_sample10BT/tokenizer.json
  special_tokens_map_path: runs/tokenizer_300m_fineweb_edu_sample10BT/special_tokens_map.json
  hf_passthrough_ids: true
