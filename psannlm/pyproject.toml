[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "psannlm"
version = "2.0.1"
description = "PSANN-LM: language modeling and training utilities for PSANN"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Nicholas Milinkovich" }
]
keywords = ["pytorch", "language-modeling", "transformers", "sine", "psann"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "psann>=2.0.1",
  "numpy>=1.23",
  "torch>=2.1",
  "sentencepiece>=0.1.99",
  "tokenizers>=0.13",
  "datasets>=2.14",
  "huggingface-hub>=0.16.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
evaluation = ["lm-eval>=0.4"]
language-filter = ["langdetect>=1.0.9"]
training-extras = ["transformers>=4.30", "bitsandbytes>=0.41"]

[project.urls]
Homepage = "https://github.com/Nickm1128/psann"
Repository = "https://github.com/Nickm1128/psann"
Issues = "https://github.com/Nickm1128/psann/issues"
Documentation = "https://github.com/Nickm1128/psann/tree/main/docs"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "__main__.py", "cli.py", "train.py", "sft.py", "eval_adapter.py", "data_loader.py", "data_stream.py", "persistence.py", "configuration.py", "lm", "_train", "architectures"]
sources = {"" = "psannlm"}

[tool.hatch.build.targets.sdist]
only-include = ["__init__.py", "__main__.py", "cli.py", "train.py", "sft.py", "eval_adapter.py", "data_loader.py", "data_stream.py", "persistence.py", "configuration.py", "lm", "_train", "architectures", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build]
exclude = [
  ".github",
  ".idea",
  ".vscode",
  ".venv*",
  "__pycache__",
  "*.py[cod]",
  ".pytest_cache",
  "tests",
]

