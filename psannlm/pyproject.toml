[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "psannlm"
dynamic = ["version"]
description = "PSANN-LM: language modeling and training utilities for PSANN"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Nicholas Milinkovich" }
]
keywords = ["pytorch", "language-modeling", "transformers", "sine", "psann"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "psann>=1.1.0rc1,<1.2",
  "packaging>=24,<27",
  "sentencepiece>=0.1.99",
  "tokenizers>=0.13",
  "datasets>=2.14",
]

[project.urls]
Homepage = "https://github.com/Nickm1128/psann"
Repository = "https://github.com/Nickm1128/psann"
Issues = "https://github.com/Nickm1128/psann/issues"
Documentation = "https://github.com/Nickm1128/psann/tree/main/docs"
Changelog = "https://github.com/Nickm1128/psann/blob/main/CHANGELOG.md"
Security = "https://github.com/Nickm1128/psann/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "psannlm/__init__.py"
"__main__.py" = "psannlm/__main__.py"
"_compat.py" = "psannlm/_compat.py"
"_version.py" = "psannlm/_version.py"
"cli.py" = "psannlm/cli.py"
"data_loader.py" = "psannlm/data_loader.py"
"data_stream.py" = "psannlm/data_stream.py"
"eval_adapter.py" = "psannlm/eval_adapter.py"
"sft.py" = "psannlm/sft.py"
"train.py" = "psannlm/train.py"
"_train" = "psannlm/_train"
"lm" = "psannlm/lm"

[tool.hatch.version]
path = "_version.py"

[tool.hatch.build]
exclude = [
  ".github",
  ".idea",
  ".vscode",
  ".venv*",
  "__pycache__",
  "*.py[cod]",
  ".pytest_cache",
  "tests",
]

