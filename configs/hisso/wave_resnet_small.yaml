estimator:
  target: psann.PSANNRegressor
  params:
    architecture:
      kind: wave
      wave:
        warmup:
          epochs: 10
      residual: {}
    hidden_layers: 4
    hidden_units: 64
    epochs: 60
    batch_size: 32
    lr: 0.0005
    random_state: 23
    device: cuda:0
episodic:
  enabled: true
  strategy:
    kind: hisso
    schedule:
      episode_length: 48
      batch_episodes: 8
      updates_per_epoch: 4
    primary_transform: softmax
    transition_penalty: 0.02
    mixed_precision: true
    amp_dtype: float16
    warm_start:
      epochs: 2
      batch_size: 32
data:
  npz: ../../datasets/wave_resnet_small.npz
training:
  verbose: 1
evaluation:
  portfolio_prices_key: prices_test
  trans_cost: 0.001
