estimator:
  target: psann.PSANNRegressor
  params:
    architecture:
      kind: wave
      wave:
        warmup:
          epochs: 5
        progressive_depth:
          initial_layers: 2
          interval: 5
      residual: {}
    hidden_layers: 3
    hidden_units: 48
    epochs: 15
    batch_size: 16
    lr: 0.0005
    random_state: 37
    device: cpu
episodic:
  enabled: true
  strategy:
    kind: hisso
    schedule:
      episode_length: 32
      batch_episodes: 32
      updates_per_epoch: 1
    primary_transform: softmax
    transition_penalty: 0.01
    mixed_precision: false
    warm_start:
      epochs: 2
      batch_size: 32
data:
  npz: ../../datasets/wave_resnet_small.npz
training:
  verbose: 1
evaluation:
  portfolio_prices_key: prices_test
  trans_cost: 0.001
