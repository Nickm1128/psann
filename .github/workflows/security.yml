name: Supply-chain security

on:
  workflow_call:
    inputs:
      release_identity:
        description: Package version associated with retained security evidence
        required: false
        type: string
        default: development
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - "constraints/**"
      - "deploy/**"
      - "pyproject.toml"
      - "src/psann/**"
  schedule:
    - cron: "23 8 * * 3"
  workflow_dispatch:
    inputs:
      release_identity:
        description: Package version associated with retained security evidence
        required: false
        type: string
        default: development

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install production dependency surfaces
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[serve,export,explain] pip-audit==2.10.0
          mkdir -p reports/security

      - name: Audit installed Python dependencies
        run: |
          pip-audit \
            --format json \
            --output reports/security/python-audit.json

      - name: Scan repository for committed secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: reports/security/trivy-secrets.json
          exit-code: 1
          version: v0.72.0

      - name: Generate source and Python SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          output-file: reports/security/psann-source.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Upload dependency and SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psann-dependency-security-${{ inputs.release_identity || 'development' }}-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 90

  container-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build reference service image
        run: |
          mkdir -p reports/security
          docker build -f deploy/Dockerfile -t psann-serving:security .

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: psann-serving:security
          output-file: reports/security/psann-serving.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Scan image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: psann-serving:security
          format: json
          output: reports/security/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.72.0

      - name: Upload vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psann-security-${{ inputs.release_identity || 'development' }}-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 90
