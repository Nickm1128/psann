name: Reference serving container

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - "constraints/deployment-py311.txt"
      - "deploy/**"
      - "pyproject.toml"
      - "src/psann/**"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create native smoke artifact
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python - <<'PY'
          import numpy as np
          import psann

          inputs = np.asarray(
              [[0.0, 1.0], [1.0, 0.0], [0.5, 0.25], [0.25, 0.5]],
              dtype=np.float32,
          )
          model = psann.create_model(
              psann.ModelSpec(
                  input_schema=psann.DataSchema(input_shape=(2,)),
                  parameters={"hidden_layers": 1, "hidden_units": 4, "random_state": 3},
              )
          )
          run = psann.train(
              model,
              (inputs, inputs[:, 0] - inputs[:, 1]),
              config=psann.TrainingConfig(epochs=1, batch_size=2, deterministic=True),
          )
          run.export("artifacts/container-smoke.psann")
          PY
          chmod 0444 artifacts/container-smoke.psann

      - name: Build image
        run: docker build -f deploy/Dockerfile -t psann-serving:smoke .

      - name: Serve mounted artifact
        run: |
          docker run --detach --name psann-serving-smoke \
            --publish 8080:8080 \
            --mount type=bind,source="$PWD/artifacts/container-smoke.psann",target=/artifacts/model.psann,readonly \
            psann-serving:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ready
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/metadata
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"inputs":[[0.0,1.0],[1.0,0.0]]}' \
            http://127.0.0.1:8080/predict

      - name: Container logs
        if: always()
        run: docker logs psann-serving-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm --force psann-serving-smoke || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python -m build psannlm

      - name: Resolve release artifacts
        id: release_artifacts
        run: |
          echo "core_wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_OUTPUT"
          echo "core_sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" >> "$GITHUB_OUTPUT"
          echo "lm_wheel=$(find psannlm/dist -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_OUTPUT"
          echo "lm_sdist=$(find psannlm/dist -maxdepth 1 -name '*.tar.gz' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Generate core wheel SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.release_artifacts.outputs.core_wheel }}
          artifact-name: psann-wheel-${{ github.ref_name }}.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-release-assets: true

      - name: Generate core source distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.release_artifacts.outputs.core_sdist }}
          artifact-name: psann-sdist-${{ github.ref_name }}.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-release-assets: true

      - name: Generate language-model wheel SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.release_artifacts.outputs.lm_wheel }}
          artifact-name: psannlm-wheel-${{ github.ref_name }}.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-release-assets: true

      - name: Generate language-model source distribution SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.release_artifacts.outputs.lm_sdist }}
          artifact-name: psannlm-sdist-${{ github.ref_name }}.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-release-assets: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/serve
          tags: |
            type=ref,event=tag

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}/serve:${{ steps.metadata.outputs.version }}
          artifact-name: psann-serving-${{ steps.metadata.outputs.version }}.spdx.json
          format: spdx-json
          syft-version: v1.44.0
          upload-release-assets: true
