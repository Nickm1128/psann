name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Canonical Ruff, Black, and mypy checks
        run: python tools/quality.py lint

      - name: Reject patch whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA"...HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - name: Repository hygiene
        run: python tools/repo_hygiene_audit.py --strict-long-files --json

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Fast CPU suite
        run: python -m pytest -m "not slow and not gpu"

  installed-wheel-platform:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PSANN_API_CHECK_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install the candidate wheel with workplace extras
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse
          CORE_WHEEL=$(find wheelhouse -maxdepth 1 -name '*.whl' -print -quit)
          python -m pip install "${CORE_WHEEL}[explain,serve,sklearn]" pandas pytest "httpx2>=2,<3"
          python -m pip check

      - name: Verify installed API, lifecycle, artifact, inference, service, and SHAP
        run: |
          python tools/check_public_api.py
          python tools/installed_workplace_smoke.py --require-installed --explain

      - name: Upload installed-wheel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-wheel-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  dependency-matrix:
    name: Dependency evidence (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core-floor
            constraints: constraints/workplace-floor.txt
            explain: "false"
          - profile: core-snapshot
            constraints: constraints/workplace-py311.txt
            explain: "false"
          - profile: core-current
            constraints: ""
            explain: "false"
          - profile: shap-floor
            constraints: constraints/explain-floor-py311.txt
            explain: "true"
          - profile: shap-current
            constraints: ""
            explain: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Build candidate wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir wheelhouse

      - name: Install selected dependency profile
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          CONSTRAINTS: ${{ matrix.constraints }}
          EXPLAIN: ${{ matrix.explain }}
        run: |
          CORE_WHEEL=$(find wheelhouse -maxdepth 1 -name '*.whl' -print -quit)
          EXTRA="serve,sklearn"
          if [[ "$EXPLAIN" == "true" ]]; then EXTRA="explain,serve,sklearn"; fi
          if [[ -n "$CONSTRAINTS" ]]; then
            python -m pip install -c "$CONSTRAINTS" "${CORE_WHEEL}[${EXTRA}]" pandas "httpx2>=2,<3"
          else
            python -m pip install --upgrade "${CORE_WHEEL}[${EXTRA}]" pandas "httpx2>=2,<3"
          fi
          python -m pip check
          if [[ "$PROFILE" == "core-floor" ]]; then
            python -c "import numpy, sklearn, torch; assert numpy.__version__ == '1.26.4'; assert sklearn.__version__ == '1.4.2'; assert torch.__version__.split('+')[0] == '2.4.1'"
          fi
          if [[ "$PROFILE" == "shap-floor" ]]; then
            python -c "import importlib.metadata; assert importlib.metadata.version('shap') == '0.50.0'"
          fi

      - name: Run installed dependency-profile smoke
        shell: bash
        env:
          EXPLAIN: ${{ matrix.explain }}
        run: |
          ARGS="--require-installed"
          if [[ "$EXPLAIN" == "true" ]]; then ARGS="$ARGS --explain"; fi
          python tools/installed_workplace_smoke.py $ARGS

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Core, PSANN-LM, and scripts coverage
        run: python tools/run_coverage.py

      - name: Upload scoped coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: scoped-coverage-${{ github.sha }}
          path: coverage/*.xml

  explainability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install explanation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,explain]

      - name: SHAP integration suite
        run: python -m pytest tests/test_explainability.py

  package-smoke:
    runs-on: ubuntu-latest
    needs: [quality, tests, installed-wheel-platform, dependency-matrix, explainability]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m build psannlm

      - name: Smoke-test built wheels in a temporary environment
        run: python tools/package_smoke.py

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.sha }}
          path: |
            dist/*
            psannlm/dist/*
