[mypy]
python_version = 3.11
files =
    src/psann/platform,
    src/psann/types.py,
    src/psann/state.py,
    src/psann/training_events.py,
    src/psann/training_checkpoint.py,
    src/psann/_version.py,
    src/psann/__init__.py,
    psannlm/__init__.py
explicit_package_bases = True
follow_imports = skip
ignore_missing_imports = True
disable_error_code = import-untyped
warn_unused_configs = True
check_untyped_defs = True
no_implicit_optional = True

[mypy-psann.platform.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

[mypy-psann.training_events]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

[mypy-psann.training_checkpoint]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
