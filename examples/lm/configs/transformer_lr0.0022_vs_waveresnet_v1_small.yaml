# Canonical model mappings; dimensions and sweep values preserve the original experiment.
bench:
  run_name: transformer_lr0.0022_vs_waveresnet_v1_small
  out_dir: reports/benchmarks
  seeds:
  - 1337
  - 1338
  reuse_tokenizer: true
  with_lm_eval: false
  save_run_logs: true
data:
  dataset: iohadrubin/wikitext-103-raw-v1
  name: null
  data_files: null
  revision: null
  train_split: train
  val_split: validation
  text_key: text
  streaming: true
  shuffle: true
  shuffle_buffer: 10000
  ascii_only: false
  languages: []
  lang_threshold: 0.8
  max_length: 1024
tokenizer:
  backend: tokenizers
  vocab_size: 16384
  min_frequency: 2
  sample_limit: 20000
  save_dir: runs/tokenizers/base_param_sweep_hypotheses_v1_small
  model_path: null
  special_tokens_map_path: null
train:
  batch_tokens: 32768
  grad_accum_steps: 1
  lr: 0.0022
  weight_decay: 0.01
  warmup_steps: 100
  optimizer: adamw
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  label_smoothing: 0.0
  grad_clip: 1.0
  amp: bf16
  grad_checkpoint: false
  log_gpu_mem: false
  ddp: 'off'
  max_steps: 500
  log_interval_steps: 25
  save_interval_steps: 1000000
eval:
  batch_tokens: 32768
  max_tokens: 1000000
  max_batches: 0
models:
  transformer:
    kind: lm
    architecture:
      kind: transformer
      activation:
        kind: gelu
        amplitude_init: 1.0
        frequency_init: 1.0
        decay_init: 0.1
        learnable:
        - amplitude
        - frequency
        - decay
        decay_mode: abs
        slope_init: 1.0
        slope_trainable: true
        clip_max: 1.0
        phase_init: 0.0
        phase_trainable: true
        ratio_sum_tol: 0.001
        mix_layout: random
        feature_dim: -1
    d_model: 256
    n_layers: 6
    n_heads: 4
    d_mlp: 1024
    dropout: 0.0
    positional_encoding: rope
    attention_implementation: auto
