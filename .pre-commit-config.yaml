repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.2
    hooks:
      - id: nbstripout
        files: \.ipynb$
  - repo: local
    hooks:
      - id: psann-quality
        name: PSANN canonical Ruff, Black, and mypy checks
        entry: python tools/quality.py lint
        language: system
        pass_filenames: false
        always_run: true
      - id: psann-hygiene
        name: PSANN repository hygiene
        entry: python tools/repo_hygiene_audit.py --strict-long-files
        language: system
        pass_filenames: false
        always_run: true
